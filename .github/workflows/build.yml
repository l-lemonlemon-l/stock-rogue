# Builds Windows and Mac versions on GitHub's machines (Mac builds must run on a Mac).
# Run it from the Actions tab (build > Run workflow), or push a tag like v1.0.0.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Build Windows
        if: matrix.name == 'windows'
        run: |
          npx electron-builder --win --x64 --publish never
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "Stock-Rogue-Windows.zip"
          Move-Item "dist/*Setup*.exe" "Stock-Rogue-Windows-Setup.exe"

      - name: Build Mac
        if: matrix.name == 'mac'
        env:
          # Mac signing + notarization (add these as repo secrets). Without them the app is ad-hoc signed.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          set -o pipefail
          # on failure, post the last lines of the build log as error notes (visible in the run summary)
          npx electron-builder --mac --arm64 --x64 --publish never 2>&1 | tee build.log || { echo "::error::$(tail -30 build.log | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          # zip with ditto so the app's internal links and permissions survive
          ditto -c -k --keepParent "dist/mac-arm64/Stock Rogue.app" Stock-Rogue-Mac-AppleSilicon.zip
          ditto -c -k --keepParent "dist/mac/Stock Rogue.app" Stock-Rogue-Mac-Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Rogue-${{ matrix.name }}
          path: |
            Stock-Rogue-Windows.zip
            Stock-Rogue-Windows-Setup.exe
            Stock-Rogue-Mac-AppleSilicon.zip
            Stock-Rogue-Mac-Intel.zip
          if-no-files-found: warn
