# Builds Windows and Mac versions on GitHub's machines (Mac builds must run on a Mac).
# Run it from the Actions tab (build > Run workflow) to get the files as artifacts.
# Push a tag like v1.0.0 to also build Android and Web and publish everything as a GitHub Release.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Build Windows
        if: matrix.name == 'windows'
        run: |
          npx electron-builder --win --x64 --publish never
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "Stock-Rogue-Windows.zip"
          Move-Item "dist/*Setup*.exe" "Stock-Rogue-Windows-Setup.exe"

      - name: Build Mac
        if: matrix.name == 'mac'
        env:
          # Optional Apple Developer signing + notarization: add these as repo secrets.
          # Without them the apps get a free ad-hoc signature (players right-click > Open the first time).
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ -n "$MAC_CERT" ]; then
            export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"; SIGN=""
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; export CSC_IDENTITY_AUTO_DISCOVERY=false; SIGN="-c.mac.identity=-"
          fi
          # on failure, post the end of the build log as an error note (visible in the run summary)
          npx electron-builder --mac --arm64 --x64 --publish never $SIGN 2>&1 | tee build.log || { python3 -c "import sys; t=sys.stdin.read()[-5000:]; print('::error::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))" < build.log; exit 1; }
          # zip with ditto so the app's internal links and permissions survive
          ditto -c -k --keepParent "dist/mac-arm64/Stock Rogue.app" Stock-Rogue-Mac-AppleSilicon.zip
          ditto -c -k --keepParent "dist/mac/Stock Rogue.app" Stock-Rogue-Mac-Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Rogue-${{ matrix.name }}
          path: |
            Stock-Rogue-Windows.zip
            Stock-Rogue-Windows-Setup.exe
            Stock-Rogue-Mac-AppleSilicon.zip
            Stock-Rogue-Mac-Intel.zip
          if-no-files-found: warn

  android:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Web version zip
        run: |
          npm run build:web
          (cd www && zip -qr ../Stock-Rogue-Web.zip .)
      - run: npm run build:android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Stock-Rogue-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Rogue-android
          path: |
            Stock-Rogue-Android.apk
            Stock-Rogue-Web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "${{ github.ref_name }}" files/* --repo "${{ github.repository }}" --title "Stock Rogue ${{ github.ref_name }}" --notes "Downloads:
          - Windows: Stock-Rogue-Windows-Setup.exe (installer) or Stock-Rogue-Windows.zip (no install)
          - Mac: Stock-Rogue-Mac-AppleSilicon.zip (M1 and newer) or Stock-Rogue-Mac-Intel.zip. First launch: right-click the app > Open.
          - Android: Stock-Rogue-Android.apk (allow installs from unknown sources)
          - Web: Stock-Rogue-Web.zip (upload to any static web host)"
