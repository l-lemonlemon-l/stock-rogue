# Builds the Android app. Download the APK from the run's Artifacts section and install it on a phone.
name: Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # the desktop app isn't needed for Android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Rogue-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
